name: CI

# Lean workflow: build the portable core + run the unit tests on all three OSes,
# and compile each mount adapter on its native, correctly-toolchained runner.
# No code signing and no live-mount integration test (those want a real desktop
# and certs); CI proves the code compiles everywhere and the engine is correct.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The engine, crypto, index and key handling — identical everywhere.
  core:
    name: Core + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS runners need paid minutes; don't let them fail the whole run.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build core
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  # The fuser adapter (macOS/Linux). We compile it on Linux where libfuse3 is a
  # clean apt install; the same source is what macOS uses with macFUSE/FUSE-T.
  mount-fuser:
    name: fuser adapter (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libfuse3
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
      - name: Build mount adapter
        run: cargo build --features mount --bin cloak-mount --verbose

  # The desktop app (pyapp/, PySide6 + QFluentWidgets): install its
  # dependencies and make sure it compiles. Releases package it with PyInstaller.
  app:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r pyapp/requirements.txt pyinstaller
      - name: Compile
        run: python -m py_compile pyapp/cloak_app.py pyapp/package.py

  # The WinFsp adapter. This is the whole reason for CI: windows-latest ships the
  # MSVC toolchain, so the adapter compiles here with ZERO local MSVC install.
  winmount:
    name: WinFsp adapter (Windows, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # defaults to x86_64-pc-windows-msvc here
      - uses: Swatinem/rust-cache@v2
      - name: Install WinFsp (runtime + SDK headers)
        run: choco install winfsp -y --no-progress
      - name: Point bindgen at libclang
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Build Windows binaries (release)
        run: cargo build --release --features winfsp --bin cloak --bin cloak-winmount --verbose
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: cloak-windows
          path: |
            target/release/cloak.exe
            target/release/cloak-winmount.exe
          retention-days: 7
