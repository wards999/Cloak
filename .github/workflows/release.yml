name: Release

# Push a tag like `v0.1.0` to build the Windows zip and the macOS disk image
# and publish a GitHub release with them attached. Release notes come from
# .github/release-notes/<tag>.md when present.
#
# Run it by hand (Actions -> Release -> Run workflow) for a dry run: it builds
# both packages and keeps them as run artifacts, but publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # x86_64-pc-windows-msvc
      - name: Install WinFsp (runtime + SDK headers)
        run: choco install winfsp -y --no-progress
      - name: Point bindgen at libclang
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Build the engine
        run: cargo build --release --features winfsp --bin cloak --bin cloak-winmount
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package the app
        shell: pwsh
        run: |
          pip install -r pyapp/requirements.txt pyinstaller
          python pyapp/package.py target/release out
          Copy-Item README.md out/Cloak
          $zip = "cloak-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path out/Cloak -DestinationPath $zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: cloak-${{ github.ref_name }}-windows-x64.zip

  macos:
    name: macOS binaries (Apple Silicon)
    # macos-latest runs on Apple Silicon, so this is a native build.
    runs-on: macos-latest
    env:
      # macFUSE installs libfuse + fuse.pc under /usr/local.
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macFUSE (headers + libfuse for linking)
        run: |
          brew install --cask macfuse
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
      - name: Build the engine
        run: |
          cargo build --release --bin cloak
          cargo build --release --features mount --bin cloak-mount
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package the app
        run: |
          pip install -r pyapp/requirements.txt pyinstaller
          python pyapp/package.py target/release out
          file out/Cloak.app/Contents/MacOS/bin/*
      - name: Build the disk image
        run: |
          # The usual layout: the app, a shortcut to Applications to drag it
          # onto, and the README.
          mkdir dmg
          mv out/Cloak.app dmg/
          ln -s /Applications dmg/Applications
          cp README.md dmg/
          image="cloak-${{ github.ref_name }}-macos-arm64.dmg"
          # hdiutil sometimes fails with "Resource busy" on CI runners; retry.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Cloak" -srcfolder dmg -fs HFS+ -format UDZO -ov "$image" && break
            echo "hdiutil failed (attempt $attempt), retrying"; sleep 5
          done
          hdiutil verify "$image"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: cloak-${{ github.ref_name }}-macos-arm64.dmg

  publish:
    name: Publish release
    needs: [windows, macos]
    # Only for a pushed tag; a manual run is a dry run.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" dist/*.zip dist/*.dmg --title "cloak $TAG" --verify-tag "$@"
